<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Feature Lab, a SetLiteWeb mini app. Runs offline: nothing is loaded
       from other sites; no analytics, no cookies. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0B1510">
  <title>Feature Lab</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    html, body { margin: 0; height: 100%; background: #0B1510; overflow: hidden; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font: 600 15px -apple-system, Roboto, sans-serif; color: #9DB5A6; transition: opacity .3s; }
    #loading .ring { width: 46px; height: 46px; border-radius: 50%; border: 4px solid #1C3226; border-top-color: #45D684; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="ring"></div><div>Loading Feature Lab…</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loading');
      if (l) { l.style.opacity = '0'; setTimeout(function () { l.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
